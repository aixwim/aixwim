name: Aixwim News Autopilot

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run News Autopilot (fallback bank topik — TERAI hanya jalan lokal di Termux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_TERAI: '0'
        run: |
          python main.py

      - name: Verify Site
        run: |
          echo "✅ Autopilot selesai — situs diperbarui otomatis"
          ls -la index.html artikel/ | head -20
